name: Build VIctory
on: workflow_dispatch
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Build
        run: cargo build --release -p victory
      - name: Package
        shell: pwsh
        run: |
          New-Item -ItemType Directory out | Out-Null
          Copy-Item target/release/victory.exe out/
          Compress-Archive -Path out/* -DestinationPath victory-windows.zip
      - uses: actions/upload-artifact@v4
        with:
          name: victory-windows
          path: victory-windows.zip
